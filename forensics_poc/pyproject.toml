[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mafc-forensics-poc"
version = "0.1.0"
description = "Offline-first, rule-based proof of concept for multi-agent cyber-forensic triage."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cleanvee contributors"}]
dependencies = [
  "fastapi>=0.111,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.30,<1.0",
  "weasyprint>=62,<70",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
mafc = "forensics_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # Report templates and forensic descriptions are deliberately readable prose.
  "E501",
  # `str, Enum` preserves JSON-facing schema compatibility across supported runtimes.
  "UP042",
]

[tool.coverage.run]
source = ["forensics_poc"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
