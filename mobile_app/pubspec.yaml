name: cleanvee_mobile
description: Cleanvee Mobile App - Facility Management on the Go
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  firebase_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0

  # State Management
  provider: ^6.1.0
  riverpod: ^2.4.0

  # UI & Navigation
  go_router: ^12.0.0
  flutter_localizations:
    sdk: flutter

  # Camera & NFC
  camera: ^0.10.5
  nfc_manager: ^3.3.0
  image_picker: ^1.0.7

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.0.0
  shared_preferences: ^2.2.0

  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
